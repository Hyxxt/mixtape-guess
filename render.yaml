services:
  - type: web
    name: caige-radio
    runtime: node
    plan: free
    region: singapore
    buildCommand: node scripts/build.mjs
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
      - key: DB_FILE
        value: /opt/render/project/src/.data/quiz.sqlite
