services:
  - type: web
    name: caige-radio
    runtime: node
    plan: free
    region: singapore
    # Add TURSO_DATABASE_URL and TURSO_AUTH_TOKEN in the Render dashboard
    # (or as Blueprint secrets) to persist the leaderboard across deploys.
    buildCommand: npm ci --omit=dev && node scripts/build.mjs
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
      - key: DB_FILE
        value: /opt/render/project/src/.data/quiz.sqlite
