name: keepalive

on:
  schedule:
    # 只在 UTC 00:00–15:59（北京时间 08:00–23:59）每 10 分钟保活一次。
    # 24/7 保活约 730 小时/月，会吃满 Render workspace 共享的 750 小时；
    # 夜间休眠，把额度留给其他作品。
    - cron: "3-59/10 0-15 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the app
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 90 --retry 2 --retry-delay 5 \
            https://caige-radio.onrender.com/api/health || true)
          echo "HTTP $code"
          [ "$code" = "200" ] || exit 1
