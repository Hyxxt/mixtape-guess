name: keepalive

on:
  schedule:
    # 北京时间 08:00–24:00，每 5 分钟探测一次，避开整点。
    # 24/7 保活约 730 小时/月，会吃满 Render workspace 共享的 750 小时；
    # 夜间休眠，把额度留给其他作品。
    - cron: "3-59/5 0-15 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the app
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --connect-timeout 10 --max-time 50 \
                https://caige-radio.onrender.com/api/health | jq -e '.ok == true' > /dev/null; then
              echo "Health check passed (attempt $attempt)"
              exit 0
            fi
            if [[ "$attempt" != 3 ]]; then sleep 5; fi
          done
          echo "The app did not return a healthy response" >&2
          exit 1
