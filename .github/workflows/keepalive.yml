name: keepalive

on:
  schedule:
    # 每 10 分钟唤醒一次，避免 Render 免费实例休眠后首次访问等 40 秒
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the app
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 90 --retry 2 --retry-delay 5 \
            https://caige-radio.onrender.com/api/me || true)
          echo "HTTP $code"
          [ "$code" = "200" ] || exit 1
